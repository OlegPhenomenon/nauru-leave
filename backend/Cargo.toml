[package]
name = "nauru-leave"
version = "0.1.0"
edition = "2021"
description = "Nauru Leave Desk — domain core"
license = "MIT"

[lib]
name = "nauru_leave"
path = "src/lib.rs"

[[bin]]
name = "nauru-leave"
path = "src/main.rs"

[dependencies]
anyhow = "=1.0.104"
argon2 = "=0.6.0"
axum = { version = "=0.8.9", features = ["multipart"] }
axum-extra = { version = "=0.12.6", features = ["cookie"] }
chacha20poly1305 = "=0.11.0"
clap = { version = "=4.6.7", features = ["derive", "env"] }
csv = "=1.4.0"
hex = "=0.4.3"
lettre = { version = "=0.11.23", default-features = false, features = ["rustls-tls", "smtp-transport", "hostname", "builder"] }
mime_guess = "=2.0.5"
rand = "=0.10.3"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rust-embed = { version = "=8.13.0", features = ["interpolate-folder-path"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
tar = "=0.4.46"
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["parsing", "formatting", "macros", "serde"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "signal", "time"] }
totp-rs = "=6.0.0"
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.6.11", features = ["compression-gzip", "set-header", "trace", "limit"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
uuid = { version = "=1.27.0", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
opt-level = "s"

[profile.dev]
debug = "line-tables-only"

[dev-dependencies]
http-body-util = "=0.1.5"
