services:
  nauru-leave:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - nauru-data:/var/lib/nauru-leave
    env_file: .env
    environment:
      NLD_BIND: 0.0.0.0:8080
      NLD_DATA_DIR: /var/lib/nauru-leave
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/up"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  # Optional production scanner. Uncomment and set NLD_CLAMD_ADDR=clamav:3310 in .env.
  # Keep signature databases updated; size resources for ClamAV independently of the app.
  # clamav:
  #   image: clamav/clamav:1.4.6-debian13-slim
  #   volumes:
  #     - clamav-data:/var/lib/clamav
  #   restart: unless-stopped
  #   # TCP 3310 stays on the internal compose network; do not publish it.
volumes:
  nauru-data:
  # clamav-data:
